name: Uplatnice
version: "0.2.0"
slug: uplatnice
description: Croatian HUB-3A payment slips with barcode, templates, payment history and bill trackers
url: https://github.com/bubafinder/uplatnice-ha
arch:
  - aarch64
  - amd64
image: ghcr.io/bubafinder/uplatnice-ha-{arch}
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:receipt-text-outline
panel_title: Uplatnice
# SQLite is copied consistently only while the add-on is stopped
backup: cold
